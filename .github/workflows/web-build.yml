name: Gerar versão Web para teste móvel

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-mobile-prototype
    paths:
      - "godot/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/web-build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Baixar Godot 4.4.1 e templates
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates
          find templates -type f \( -name 'web_nothreads_release.zip' -o -name 'web_nothreads_debug.zip' \) -exec cp {} "$HOME/.local/share/godot/export_templates/4.4.1.stable/" \;

      - name: Normalizar modelos 3D para compatibilidade Godot
        run: |
          npx --yes @gltf-transform/cli --help >/dev/null
          while IFS= read -r -d '' file; do
            temp="${file%.glb}.normalized.glb"
            npx --yes @gltf-transform/cli copy "$file" "$temp"
            npx --yes @gltf-transform/cli dequantize "$temp" "$file"
            rm -f "$temp"
          done < <(find assets -type f -name '*.glb' -print0)

      - name: Importar recursos e validar projeto
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import --quit

      - name: Verificar inicialização e scripts do jogo
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 8 2>&1 | tee /tmp/godot-web-startup.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|Invalid call|Invalid get index' /tmp/godot-web-startup.log; then
            echo "A inicialização apresentou erros; publicação bloqueada."
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Selecionar renderer compatível com navegadores
        run: |
          sed -i 's#renderer/rendering_method="mobile"#renderer/rendering_method="gl_compatibility"#' project.godot
          grep -q 'renderer/rendering_method="gl_compatibility"' project.godot

      - name: Exportar versão Web
        run: |
          mkdir -p build/web
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          ls -lah build/web

      - name: Testar jogo em navegador virtual com WebGL
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory build/web >/tmp/web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page = await browser.newPage({viewport:{width:1280,height:720},deviceScaleFactor:1});
          const errors = [];
          page.on('pageerror', e => errors.push('PAGE: '+e.message));
          page.on('console', m => { if(m.type()==='error') errors.push('CONSOLE: '+m.text()); });
          page.on('requestfailed', r => errors.push('REQUEST: '+r.url()+' '+r.failure()?.errorText));
          try {
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(45000);
            const state = await page.evaluate(() => ({
              title: document.title,
              canvas: [...document.querySelectorAll('canvas')].map(c=>({width:c.width,height:c.height,clientWidth:c.clientWidth,clientHeight:c.clientHeight})),
              bodyText: document.body.innerText.slice(0,500),
              webgl: (()=>{const c=document.createElement('canvas'); return !!(c.getContext('webgl2')||c.getContext('webgl'));})()
            }));
            await page.screenshot({path:'build/web/browser-smoke.png',fullPage:false});
            console.log('BROWSER_STATE='+JSON.stringify(state));
            console.log('BROWSER_ERRORS='+JSON.stringify(errors));
            if (!state.canvas.length || !state.canvas.some(c=>c.width>0 && c.height>0)) throw new Error('Godot não criou um canvas válido no Chromium.');
            if (errors.some(e=>/wasm|webgl|uncaught|failed to load|cannot open file|failed loading resource|failed loading scene|script error|parse error|out of memory/i.test(e))) throw new Error('Erros relevantes no navegador: '+errors.join(' | '));
          } finally { await browser.close(); }
          NODE

      - name: Publicar versão Web como artefato
        uses: actions/upload-artifact@v4
        with:
          name: O-Ultimo-Refugio-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: Preparar publicação no GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/


  deploy:
    runs-on: ubuntu-24.04
    needs: web-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar jogo para navegador
        id: deployment
        uses: actions/deploy-pages@v4
