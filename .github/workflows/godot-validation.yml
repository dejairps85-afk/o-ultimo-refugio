name: Validar protótipo Godot

on:
  push:
    branches:
      - feature/godot-mobile-prototype
    paths:
      - "godot/**"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Godot 4.4.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Importar e validar projeto
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit
      - name: Executar cena principal em modo headless
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --quit-after 5
