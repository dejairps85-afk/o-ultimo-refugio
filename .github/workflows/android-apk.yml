name: Gerar APK Android de teste

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-mobile-prototype
    paths:
      - "godot/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Android SDK pré-instalado no runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Baixar Godot 4.4.1 e templates Android
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates
          find templates -name android_debug.apk -exec cp {} "$HOME/.local/share/godot/export_templates/4.4.1.stable/" \;
          find templates -name android_release.apk -exec cp {} "$HOME/.local/share/godot/export_templates/4.4.1.stable/" \;
          find "$HOME/.local/share/godot/export_templates/4.4.1.stable" -maxdepth 1 -type f -print

      - name: Preparar SDK e chave de depuração
        run: |
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=O Ultimo Refugio,C=BR"

      - name: Importar recursos e validar projeto
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import --quit

      - name: Exportar APK de teste
        run: |
          mkdir -p build/android
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Android" build/android/O_Ultimo_Refugio-debug.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: O-Ultimo-Refugio-Android-debug
          path: build/android/O_Ultimo_Refugio-debug.apk
          if-no-files-found: error
          retention-days: 14
