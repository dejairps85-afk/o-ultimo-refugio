name: Cinematic asset preparation
on:
  push:
    branches: [feature/next-gen-rebuild]
    paths:
      - scripts/import_cinematic_materials.py
      - .github/workflows/cinematic-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import_cinematic_materials.py
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-pbr-materials
          path: assets/textures/cinematic/
          if-no-files-found: error
      - name: Save verified texture maps on experimental branch
        if: github.ref == 'refs/heads/feature/next-gen-rebuild'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/textures/cinematic/
          if ! git diff --cached --quiet; then
            git commit -m "Import cinematic CC0 PBR texture maps"
            git push origin HEAD:feature/next-gen-rebuild
          fi
